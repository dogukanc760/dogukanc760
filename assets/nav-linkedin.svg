<svg xmlns="http://www.w3.org/2000/svg" width="240" height="70" viewBox="0 0 240 70"><title>CONNECT</title><style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.flow{stroke-dasharray:6 13;animation:flow 4s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.blink{animation:blink 1.2s steps(2,end) infinite}@keyframes flow{to{stroke-dashoffset:-114}}@keyframes pulse{50%{opacity:.35}}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){.flow,.pulse,.blink{animation:none}}</style><rect x="1" y="1" width="238" height="68" rx="9" fill="#0e1729" stroke="#25354d" /><text x="15" y="26" font-size="14" fill="#6bb6ff" >ssh linkedin</text><text x="15" y="51" font-size="10" fill="#8fa3c1" >CONNECT  ↗</text></svg>