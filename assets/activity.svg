<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="156" viewBox="0 0 1000 156" role="img"><title>GITHUB ACTIVITY</title><defs><linearGradient id="edge"><stop stop-color="#52f4ed"/><stop offset=".55" stop-color="#b79aff"/><stop offset="1" stop-color="#fa63d4"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#9399ff" stroke-opacity=".04"/></pattern><clipPath id="clip"><rect x="1" y="1" width="998" height="154" rx="12"/></clipPath></defs><style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.flow{stroke-dasharray:8 18;animation:flow 6s linear infinite}.pulse{animation:pulse 3.4s ease-in-out infinite}.scan{animation:scan 8s linear infinite}.bars{animation:bars 4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@keyframes flow{to{stroke-dashoffset:-156}}@keyframes pulse{50%{opacity:.3}}@keyframes scan{to{transform:translateY(540px)}}@keyframes bars{50%{transform:scaleY(.45)}}@media(prefers-reduced-motion:reduce){.flow,.pulse,.scan,.bars{animation:none}}</style><rect x="1" y="1" width="998" height="154" rx="12" fill="#090b19" stroke="#2c2c50"/><rect x="2" y="2" width="996" height="152" fill="url(#grid)" rx="12"/><path d="M20 2H980" stroke="url(#edge)" stroke-width="2"/><text x="28" y="35" fill="#52f4ed" font-size="12" letter-spacing="1.5">GITHUB ACTIVITY</text><text x="972" y="35" fill="#9aa6c6" font-size="10" text-anchor="end">AUTOMATED PROFILE VISUALS</text><path d="M24 53H976" stroke="#2c2c50"/><text x="28" y="94" fill="#fa63d4" font-size="20" >AWAITING INITIAL GITHUB SYNC</text><text x="28" y="127" fill="#9aa6c6" font-size="12" >Real profile data appears after the first successful workflow run.</text><path d="M2 32V14Q2 2 14 2H32 M968 154H986Q998 154 998 142V124" fill="none" stroke="#fa63d4" stroke-width="2"/></svg>