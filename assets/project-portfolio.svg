<svg xmlns="http://www.w3.org/2000/svg" width="490" height="190" viewBox="0 0 490 190"><title>TERMINAL PORTFOLIO</title><style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.flow{stroke-dasharray:6 13;animation:flow 4s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.blink{animation:blink 1.2s steps(2,end) infinite}@keyframes flow{to{stroke-dashoffset:-114}}@keyframes pulse{50%{opacity:.35}}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){.flow,.pulse,.blink{animation:none}}</style><rect x="1" y="1" width="488" height="188" rx="10" fill="#0e1729" stroke="#25354d" /><text x="22" y="31" font-size="10" fill="#51e3d4" >INTERACTIVE EXPERIENCE</text><text x="22" y="68" font-size="22" fill="#e4edfc" >TERMINAL PORTFOLIO</text><text x="22" y="103" font-size="12" fill="#8fa3c1" >Explore my engineering background.</text><text x="22" y="125" font-size="12" fill="#8fa3c1" >Run commands. Open Recruiter Mode.</text><text x="22" y="165" font-size="13" fill="#51e3d4" >$ open portfolio  ↗</text><rect class="blink" x="440" y="151" width="8" height="15" fill="#51e3d4"/></svg>