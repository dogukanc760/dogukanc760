<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="162" viewBox="0 0 1000 162" role="img" aria-labelledby="t d"><title id="t">Delivery workflow</title><desc id="d">Commit, verify, package, reconcile, observe. An illustrative delivery pipeline, not live system status.</desc><style>text{font-family:ui-monospace,Consolas,monospace}.flow{stroke-dasharray:7 15;animation:move 5s linear infinite}@keyframes move{to{stroke-dashoffset:-110}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style><rect x="1" y="1" width="998" height="160" rx="14" fill="#0c1422" stroke="#283950"/><path d="M100 57H900" stroke="#284153" stroke-width="2"/><path class="flow" d="M100 57H900" stroke="#5eead4" stroke-width="2"/><circle cx="100" cy="57" r="22" fill="#102c34" stroke="#3f8c89"/><text x="100" y="62" text-anchor="middle" fill="#5eead4" font-size="13">01</text><text x="100" y="105" text-anchor="middle" fill="#e2e8f0" font-size="12" letter-spacing="1">COMMIT</text><text x="100" y="127" text-anchor="middle" fill="#8fa3bd" font-size="11">Version the change</text><circle cx="300" cy="57" r="22" fill="#102c34" stroke="#3f8c89"/><text x="300" y="62" text-anchor="middle" fill="#5eead4" font-size="13">02</text><text x="300" y="105" text-anchor="middle" fill="#e2e8f0" font-size="12" letter-spacing="1">VERIFY</text><text x="300" y="127" text-anchor="middle" fill="#8fa3bd" font-size="11">Build &amp; test</text><circle cx="500" cy="57" r="22" fill="#102c34" stroke="#3f8c89"/><text x="500" y="62" text-anchor="middle" fill="#5eead4" font-size="13">03</text><text x="500" y="105" text-anchor="middle" fill="#e2e8f0" font-size="12" letter-spacing="1">PACKAGE</text><text x="500" y="127" text-anchor="middle" fill="#8fa3bd" font-size="11">Containerize</text><circle cx="700" cy="57" r="22" fill="#102c34" stroke="#3f8c89"/><text x="700" y="62" text-anchor="middle" fill="#5eead4" font-size="13">04</text><text x="700" y="105" text-anchor="middle" fill="#e2e8f0" font-size="12" letter-spacing="1">RECONCILE</text><text x="700" y="127" text-anchor="middle" fill="#8fa3bd" font-size="11">Deploy with GitOps</text><circle cx="900" cy="57" r="22" fill="#102c34" stroke="#3f8c89"/><text x="900" y="62" text-anchor="middle" fill="#5eead4" font-size="13">05</text><text x="900" y="105" text-anchor="middle" fill="#e2e8f0" font-size="12" letter-spacing="1">OBSERVE</text><text x="900" y="127" text-anchor="middle" fill="#8fa3bd" font-size="11">Measure &amp; improve</text></svg>