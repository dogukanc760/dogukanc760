<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
<title id="title">Dogukan Canerler — Senior DevOps and Backend Engineer</title>
<desc id="desc">A dark engineering console with an animated infrastructure diagram. Kubernetes, GitOps, infrastructure as code, and observability.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101c31"/><stop offset="1" stop-color="#080e19"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#2dd4bf" stop-opacity=".14"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#93c5fd" stroke-opacity=".045"/></pattern>
 <style>
 text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
 .flow{stroke-dasharray:5 12;animation:flow 5s linear infinite}
 .pulse{animation:pulse 3s ease-in-out infinite}
 .cursor{animation:cursor 1.6s steps(2,end) infinite}
 @keyframes flow{to{stroke-dashoffset:-102}}
 @keyframes pulse{50%{opacity:.35}}
 @keyframes cursor{50%{opacity:0}}
 @media(prefers-reduced-motion:reduce){.flow,.pulse,.cursor{animation:none}}
 </style>
</defs>
<rect x="1" y="1" width="998" height="358" rx="18" fill="url(#bg)" stroke="#283950"/>
<rect x="2" y="2" width="996" height="356" rx="18" fill="url(#grid)"/>
<ellipse cx="820" cy="210" rx="220" ry="190" fill="url(#glow)"/>
<path d="M1 47H999" stroke="#283950"/>
<circle cx="26" cy="24" r="5" fill="#fb7185"/><circle cx="44" cy="24" r="5" fill="#fbbf24"/><circle cx="62" cy="24" r="5" fill="#2dd4bf"/>
<text x="88" y="29" fill="#9aabc2" font-size="12">dogukanc760 / engineering-console</text>
<text x="957" y="29" text-anchor="end" fill="#5eead4" font-size="11">PROFILE v2.0</text>
<text x="36" y="89" fill="#5eead4" font-size="12" letter-spacing="2">BUILD · SHIP · OBSERVE · IMPROVE</text>
<text x="34" y="144" fill="#f0f6fc" font-family="system-ui,sans-serif" font-size="44" font-weight="700" letter-spacing="-2">Dogukan Canerler</text>
<text x="36" y="179" fill="#b4c6de" font-size="18">Senior DevOps &amp; Backend Engineer</text>
<text x="36" y="218" fill="#899eb9" font-size="13">From backend services to the systems that run them.</text>
<rect x="36" y="245" width="89" height="28" rx="6" fill="#153039" stroke="#23524e"/><text x="80" y="264" text-anchor="middle" font-size="11" fill="#5eead4">KUBERNETES</text>
<rect x="135" y="245" width="72" height="28" rx="6" fill="#17243c" stroke="#2c4264"/><text x="171" y="264" text-anchor="middle" font-size="11" fill="#93c5fd">GITOPS</text>
<rect x="217" y="245" width="58" height="28" rx="6" fill="#251f3b" stroke="#42345f"/><text x="246" y="264" text-anchor="middle" font-size="11" fill="#c4b5fd">IaC</text>
<rect x="285" y="245" width="122" height="28" rx="6" fill="#17243c" stroke="#2c4264"/><text x="346" y="264" text-anchor="middle" font-size="11" fill="#93c5fd">OBSERVABILITY</text>
<text x="36" y="323" fill="#5eead4" font-size="13">$</text><text x="56" y="323" fill="#b4c6de" font-size="13">less manual work. more reliable delivery.</text><rect class="cursor" x="381" y="311" width="7" height="15" fill="#5eead4"/>
<g fill="none" stroke="#2d5967" stroke-width="1.5"><path d="M730 127H820V194H911M730 264H820V194"/><path d="M730 127V264"/></g>
<g class="flow" fill="none" stroke="#5eead4" stroke-width="1.5"><path d="M730 127H820V194H911"/><path d="M730 264H820V194"/></g>
<g fill="#0d1828" stroke="#33506a"><rect x="680" y="102" width="100" height="50" rx="10"/><rect x="680" y="239" width="100" height="50" rx="10"/><rect x="861" y="169" width="100" height="50" rx="10"/></g>
<g text-anchor="middle" font-size="12" fill="#b4c6de"><text x="730" y="132">SOURCE</text><text x="730" y="269">CONFIG</text><text x="911" y="199">CLUSTER</text></g>
<circle cx="820" cy="194" r="21" fill="#103135" stroke="#5eead4"/><circle class="pulse" cx="820" cy="194" r="7" fill="#5eead4"/>
<text x="820" y="230" text-anchor="middle" font-size="10" fill="#6f8ba5">RECONCILE</text>
<text x="820" y="324" text-anchor="middle" font-size="10" fill="#6f8ba5" letter-spacing="1">DESIRED STATE → RUNNING SYSTEMS</text>
</svg>