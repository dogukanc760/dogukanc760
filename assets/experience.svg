<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="424" viewBox="0 0 1000 424" role="img"><title>PROFESSIONAL EXPERIENCE</title><defs><linearGradient id="edge"><stop stop-color="#52f4ed"/><stop offset=".55" stop-color="#b79aff"/><stop offset="1" stop-color="#fa63d4"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#9399ff" stroke-opacity=".04"/></pattern><clipPath id="clip"><rect x="1" y="1" width="998" height="422" rx="12"/></clipPath></defs><style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.flow{stroke-dasharray:8 18;animation:flow 6s linear infinite}.pulse{animation:pulse 3.4s ease-in-out infinite}.scan{animation:scan 8s linear infinite}.bars{animation:bars 4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@keyframes flow{to{stroke-dashoffset:-156}}@keyframes pulse{50%{opacity:.3}}@keyframes scan{to{transform:translateY(540px)}}@keyframes bars{50%{transform:scaleY(.45)}}@media(prefers-reduced-motion:reduce){.flow,.pulse,.scan,.bars{animation:none}}</style><rect x="1" y="1" width="998" height="422" rx="12" fill="#090b19" stroke="#2c2c50"/><rect x="2" y="2" width="996" height="420" fill="url(#grid)" rx="12"/><path d="M20 2H980" stroke="url(#edge)" stroke-width="2"/><text x="28" y="35" fill="#52f4ed" font-size="12" letter-spacing="1.5">PROFESSIONAL EXPERIENCE</text><text x="972" y="35" fill="#9aa6c6" font-size="10" text-anchor="end">FULL HISTORY &amp; DATES IN CV</text><path d="M24 53H976" stroke="#2c2c50"/><rect x="24" y="76" width="952" height="96" rx="8" fill="#101327" stroke="#2c2c50"/><text x="44" y="100" fill="#52f4ed" font-size="11" >PANATES TEKNOLOJI</text><text x="44" y="128" fill="#edf2ff" font-size="19" >Senior DevOps &amp; Backend Developer</text><text x="550" y="117" fill="#9aa6c6" font-size="11" >Kubernetes platforms, GitOps/ArgoCD delivery, backend</text><text x="550" y="138" fill="#9aa6c6" font-size="11" >microservices, infrastructure automation, and observability.</text><rect x="44" y="146" width="90" height="3" fill="#52f4ed"/><rect x="24" y="188" width="952" height="96" rx="8" fill="#101327" stroke="#2c2c50"/><text x="44" y="212" fill="#fa63d4" font-size="11" >AKBANK / VIA MAARIFA</text><text x="44" y="240" fill="#edf2ff" font-size="19" >Senior DevOps &amp; Software Developer</text><text x="550" y="229" fill="#9aa6c6" font-size="11" >Financial APIs, Azure DevOps pipelines, and containerized</text><text x="550" y="250" fill="#9aa6c6" font-size="11" >applications in a banking environment.</text><rect x="55" y="258" width="90" height="3" fill="#fa63d4"/><rect x="24" y="300" width="952" height="96" rx="8" fill="#101327" stroke="#2c2c50"/><text x="44" y="324" fill="#b79aff" font-size="11" >FINTECH / E-COMMERCE / ENTERPRISE</text><text x="44" y="352" fill="#edf2ff" font-size="19" >Earlier engineering experience</text><text x="550" y="341" fill="#9aa6c6" font-size="11" >Backend services, marketplace and financial integrations,</text><text x="550" y="362" fill="#9aa6c6" font-size="11" >enterprise software, and web/mobile applications.</text><rect x="66" y="370" width="90" height="3" fill="#b79aff"/><path d="M2 32V14Q2 2 14 2H32 M968 422H986Q998 422 998 410V392" fill="none" stroke="#fa63d4" stroke-width="2"/></svg>